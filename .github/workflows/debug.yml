name: Generate Stats Images

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    - name: Generate images
      run: |
        ./zig-out/bin/github-stats --json-output-file stats.json
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Publish to private-stats
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
      run: |
        gh auth setup-git
        gh repo clone Yolo-TM/private-stats private-stats -- --depth=1
        cp stats.json overview.svg languages.svg private-stats/

        cd private-stats
        git config user.name "jstrieb/github-stats"
        git config user.email "github-stats[bot]@jstrieb.github.io"
        git add stats.json overview.svg languages.svg
        git diff --cached --quiet || git commit -m 'Update generated files'
        git push origin main
